services:
  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    restart: on-failure
    ports:
      - 8080:8080
    environment:
      # Read from .env next to this file; see .env.example. Never commit .env.
      COWSANDBULLS_DB_PASSWORD: ${COWSANDBULLS_DB_PASSWORD:-}
    volumes:
      # Keeps games across `docker compose down` / `up` and image rebuilds (#27).
      - game-data:/data

volumes:
  game-data:
