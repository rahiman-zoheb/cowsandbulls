# A REST API has no view rendering; keeping the session open would let lazy
# loading run during JSON serialisation, outside any transaction.
spring.jpa.open-in-view=false

# Only /actuator/health is exposed over HTTP (Spring Boot's default). Don't
# expose shutdown, env or beans: none of them are authenticated here.

# Rate limits are per client IP. Behind a reverse proxy that IP comes from
# X-Forwarded-For, which Tomcat honours only when the immediate peer is on a
# private network, so a client talking to the app directly can't spoof it.
server.forward-headers-strategy=native

# Games nobody has touched for this long are deleted, with their guesses (#11).
cowsandbulls.games.ttl=24h
cowsandbulls.games.cleanup-interval=10m
# Backstop on live games, so memory stays bounded even within the rate limits.
cowsandbulls.games.max-active=50000

# Per-client limits on /api (#12). A guess body is a few bytes, so anything
# larger than max-request-bytes is rejected with 413.
cowsandbulls.api.rate-limits-enabled=true
cowsandbulls.api.requests-per-minute=120
cowsandbulls.api.games-per-minute=10
cowsandbulls.api.max-request-bytes=1024

# Flyway owns the schema (src/main/resources/db/migration). Hibernate only
# checks the entities match it, and never creates or drops tables: the
# embedded-database default of create-drop would wipe a file database on
# every restart (#27).
spring.jpa.hibernate.ddl-auto=validate

# Without a profile, games live in memory and vanish on restart, which is the
# right default for development and tests. Run with the 'prod' profile to keep
# them on disk; see application-prod.properties.
