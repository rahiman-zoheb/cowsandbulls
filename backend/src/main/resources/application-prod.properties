# Games persist in a file-based H2 database, so a restart doesn't lose them
# (#27). The Docker image activates this profile and mounts /data as a volume.
#
# Credentials come from the environment and are never committed (#52). H2 sets
# the password when it first creates the database file, so keep it stable.
# To use another database, set SPRING_DATASOURCE_URL, USERNAME and PASSWORD
# and add its JDBC driver to the pom; the Flyway migrations are plain SQL.
spring.datasource.url=jdbc:h2:file:${COWSANDBULLS_DB_PATH:/data/cowsandbulls}
spring.datasource.username=${COWSANDBULLS_DB_USER:cowsandbulls}
spring.datasource.password=${COWSANDBULLS_DB_PASSWORD:}
