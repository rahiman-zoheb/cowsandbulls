name: Dependency snapshot

# Submits the backend's fully resolved Maven tree to GitHub's dependency graph.
# Without it Dependabot reports 0 alerts for the backend: the pom declares its
# dependencies without versions (they're inherited from spring-boot-starter-parent),
# so nothing is ever matched against advisories (#22).
#
# Maven versions here are exact, not ranges, so the tree changes only when the
# pom does.

on:
  push:
    branches: [master]
    paths:
      - backend/pom.xml
      - .github/workflows/dependency-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required by the dependency submission API
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Submit dependency snapshot
        # Pinned to a commit: this job can write to the repository.
        uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1
        with:
          directory: backend
