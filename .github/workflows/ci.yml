name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  # Decides which side of the monorepo a change touches, so a frontend-only PR
  # doesn't spend minutes on three JDK builds (and vice versa). Plain git diff
  # rather than a third-party paths-filter action, to keep the supply chain small.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          base="$PUSH_BEFORE"
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; fi

          # First push of a branch, or a base we can't see: build everything.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$base" "$HEAD_SHA")
          printf 'Changed files:\n%s\n' "$changed"
          touches() { if grep -qE "$1" <<<"$changed"; then echo true; else echo false; fi; }
          echo "backend=$(touches '^(backend/|\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "frontend=$(touches '^(frontend/|\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 17 is the language level and Spring Boot 4's minimum; 21 and 25 are
        # the current LTS releases.
        java-version: ['17', '21', '25']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-java-${{ matrix.java-version }}
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  # Builds the image from a clean checkout and smoke-tests the container, so
  # the Dockerfile can't silently depend on a locally built jar again (#24).
  backend-image:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t cowsandbulls-backend:ci backend

      - name: Smoke-test the container
        run: |
          docker run -d --name backend -p 8080:8080 cowsandbulls-backend:ci
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8080/actuator/health 2>/dev/null | grep -q '"UP"' && break
            sleep 2
          done
          curl -fsS http://localhost:8080/actuator/health
          echo
          id=$(curl -fsS -X POST http://localhost:8080/api/games | jq -r .id)
          echo "created game $id"
          user=$(docker inspect -f '{{.Config.User}}' backend)
          echo "runs as: $user"
          test "$user" = "spring:spring"

      # The image runs the prod profile, so the game must outlive the process.
      - name: Games survive a container restart
        run: |
          id=$(curl -fsS -X POST http://localhost:8080/api/games | jq -r .id)
          docker restart backend
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8080/actuator/health 2>/dev/null | grep -q '"UP"' && break
            sleep 2
          done
          curl -fsS -o /dev/null -w "GET /api/games/$id after restart -> %{http_code}" http://localhost:8080/api/games/$id
          echo

      - name: Container logs
        if: failure()
        run: docker logs backend

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 reached end-of-life in April 2026; Vite 8 and Vitest 5 need 22.12+.
        node-version: ['22.x', '24.x']
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm test -- --run --coverage

      - name: Build
        run: npm run build

  # The only check branch protection requires. It always runs, so a PR that
  # touches one side isn't left waiting forever on the other side's skipped
  # jobs; skipped counts as success, failed or cancelled does not.
  ci-success:
    if: always()
    needs: [changes, backend, backend-image, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "changes=${{ needs.changes.result }} backend=${{ needs.backend.result }} backend-image=${{ needs.backend-image.result }} frontend=${{ needs.frontend.result }}"
          exit 1

      - name: Summary
        run: echo "changes=${{ needs.changes.result }} backend=${{ needs.backend.result }} backend-image=${{ needs.backend-image.result }} frontend=${{ needs.frontend.result }}"
