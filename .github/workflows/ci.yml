name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  # Decides which side of the monorepo a change touches, so a frontend-only PR
  # doesn't spend minutes on three JDK builds (and vice versa). Plain git diff
  # rather than a third-party paths-filter action, to keep the supply chain small.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          base="$PUSH_BEFORE"
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; fi

          # First push of a branch, or a base we can't see: build everything.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "image=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$base" "$HEAD_SHA")
          printf 'Changed files:\n%s\n' "$changed"
          touches() { if grep -qE "$1" <<<"$changed"; then echo true; else echo false; fi; }
          echo "backend=$(touches '^(backend/|\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "frontend=$(touches '^(frontend/|\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"
          # The image contains both apps, so either side (or the Dockerfile) rebuilds
          # it; the browser tests run against it, so changing them does too.
          echo "image=$(touches '^(backend/|frontend/|e2e/|Dockerfile$|\.dockerignore$|\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 17 is the language level and Spring Boot 4's minimum; 21 and 25 are
        # the current LTS releases.
        java-version: ['17', '21', '25']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-java-${{ matrix.java-version }}
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  # Builds the single image (frontend inside the backend) from a clean
  # checkout and smoke-tests the running container: the app and the API on
  # one origin, client-side routes, security headers, and persistence.
  app-image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t cowsandbulls:ci .

      - name: Smoke-test the container
        run: |
          docker run -d --name app -p 8080:8080 cowsandbulls:ci
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8080/actuator/health 2>/dev/null | grep -q '"UP"' && break
            sleep 2
          done
          curl -fsS http://localhost:8080/actuator/health
          echo

          # The frontend is served from the same origin, and its assets load.
          page=$(curl -fsS http://localhost:8080/)
          grep -q '<div id="root">' <<<"$page"
          asset=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' <<<"$page" | head -1)
          test -n "$asset"
          curl -fsS -o /dev/null -w "GET $asset -> %{http_code} %{content_type}" "http://localhost:8080$asset"
          echo

          # A client-side route gets the app; an unknown API path stays a 404.
          curl -fsS http://localhost:8080/games/new | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/nope)" = 404

          # Security headers come from the backend, on the HTML too.
          curl -fsS -D - -o /dev/null http://localhost:8080/ | grep -i '^content-security-policy:'

          id=$(curl -fsS -X POST http://localhost:8080/api/games | jq -r .id)
          echo "created game $id"
          user=$(docker inspect -f '{{.Config.User}}' app)
          echo "runs as: $user"
          test "$user" = "spring:spring"

      # The image runs the prod profile, so the game must outlive the process.
      - name: Games survive a container restart
        run: |
          id=$(curl -fsS -X POST http://localhost:8080/api/games | jq -r .id)
          docker restart app
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8080/actuator/health 2>/dev/null | grep -q '"UP"' && break
            sleep 2
          done
          curl -fsS -o /dev/null -w "GET /api/games/$id after restart -> %{http_code}" http://localhost:8080/api/games/$id
          echo

      # Browser tests play whole games, faster than the production rate limits
      # allow, so they get a second container with the limits raised. The
      # limits themselves are covered by the backend tests.
      - name: Start a container for the browser tests
        run: |
          docker run -d --name e2e -p 8081:8080 \
            -e COWSANDBULLS_API_GAMESPERMINUTE=1000 \
            -e COWSANDBULLS_API_REQUESTSPERMINUTE=10000 \
            cowsandbulls:ci
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8081/actuator/health 2>/dev/null | grep -q '"UP"' && break
            sleep 2
          done
          curl -fsS http://localhost:8081/actuator/health

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install browser test dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8081
        run: npx playwright test

      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Container logs
        if: failure()
        run: |
          docker logs app
          docker logs e2e || true

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 reached end-of-life in April 2026; Vite 8 and Vitest 5 need 22.12+.
        node-version: ['22.x', '24.x']
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm test -- --run --coverage

      - name: Build
        run: npm run build

  # The only check branch protection requires. It always runs, so a PR that
  # touches one side isn't left waiting forever on the other side's skipped
  # jobs; skipped counts as success, failed or cancelled does not.
  ci-success:
    if: always()
    needs: [changes, backend, app-image, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "changes=${{ needs.changes.result }} backend=${{ needs.backend.result }} app-image=${{ needs.app-image.result }} frontend=${{ needs.frontend.result }}"
          exit 1

      - name: Summary
        run: echo "changes=${{ needs.changes.result }} backend=${{ needs.backend.result }} app-image=${{ needs.app-image.result }} frontend=${{ needs.frontend.result }}"
