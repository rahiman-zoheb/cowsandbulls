version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major upgrades are planned work with their own issues: Vite (#36),
      # React (#37), react-router (#38), reactstrap (#39), test libraries (#43).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 2.3 -> 2.7 counts as "minor", but it's the first leg of the deliberate
      # Spring Boot upgrade in #21. Remove this entry when that lands.
      - dependency-name: org.springframework.boot:spring-boot-starter-parent

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
